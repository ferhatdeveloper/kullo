name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # orchestrator has pre-existing TS debt; gate the packages that already typecheck cleanly
        run: pnpm turbo run typecheck --filter=@seyyare/shared-types --filter=@seyyare/api-auth --filter=@seyyare/ai-service

      - name: Lint
        # Full package lint needs typescript-eslint wiring; gate the placeholder package for now
        run: pnpm turbo run lint --filter=@seyyare/shared-types

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config -q

  mobile-build:
    name: Expo prebuild check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Verify Expo config
        run: npx expo config --type prebuild --json > /dev/null